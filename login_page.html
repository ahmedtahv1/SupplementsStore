<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Supplements Store</title>
    <link rel="stylesheet" href="/css/site.css?v=vHV8WCHi6dvk73ZNNGEc0E2M0nyEJECw-3GZvtU22AQ" />
</head>
<body class="bg-gray-50 dark:bg-gray-950 antialiased min-h-screen flex flex-col">

    <nav class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center gap-2">
                    <span class="material-icons text-primary-600 text-3xl">fitness_center</span>
                    <span class="text-xl font-bold text-gray-900 dark:text-white">Supplements</span>
                </a>
                <div class="flex items-center gap-4">
                    <button id="darkModeToggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-base">
                        <span class="material-icons text-gray-600 dark:text-gray-400">dark_mode</span>
                    </button>
                    <a href="/" class="text-sm text-gray-600 dark:text-gray-400 hover:text-primary-600 dark:hover:text-primary-400">
                        <span class="material-icons align-text-bottom text-lg">home</span> Back to Store
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-md">
            <div class="card shadow-xl animate-scale-in">
    <div class="card-body">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-primary-100 to-primary-200 dark:from-primary-900/30 dark:to-primary-800/30 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg">
                <span class="material-icons text-4xl text-primary-600 dark:text-primary-400">lock</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Welcome Back</h1>
            <p class="text-gray-600 dark:text-gray-400">Sign in to continue your fitness journey</p>
        </div>

        <form method="post" class="space-y-5">
            <input type="hidden" name="returnUrl" />

            

            <div>
                <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2" for="Email">Email</label>
                <input class="input" placeholder="you@example.com" autofocus type="email" data-val="true" data-val-email="Invalid email address" data-val-required="Email is required" id="Email" name="Email" value="" />
                <span class="text-xs text-red-500 mt-1 block field-validation-valid" data-valmsg-for="Email" data-valmsg-replace="true"></span>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2" for="Password">Password</label>
                <input class="input" placeholder="••••••••" type="password" data-val="true" data-val-required="Password is required" id="Password" name="Password" />
                <span class="text-xs text-red-500 mt-1 block field-validation-valid" data-valmsg-for="Password" data-valmsg-replace="true"></span>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input class="w-4 h-4 rounded border-gray-300 dark:border-gray-600 text-primary-600 focus:ring-primary-500 focus:ring-2" type="checkbox" data-val="true" data-val-required="The RememberMe field is required." id="RememberMe" name="RememberMe" value="true" />
                    <span class="text-sm text-gray-600 dark:text-gray-400">Remember me</span>
                </label>
                <a href="#" class="text-sm text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300 font-medium">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="btn btn-primary w-full">
                <span class="material-icons">login</span>
                Sign In
            </button>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white dark:bg-gray-900 text-gray-500 dark:text-gray-400">New to SupplementsStore?</span>
                </div>
            </div>

            <a href="/Account/Register" class="btn btn-outline w-full">
                <span class="material-icons">person_add</span>
                Create Account
            </a>
        <input name="__RequestVerificationToken" type="hidden" value="CfDJ8IDQ-poOl9VEmtXRJ7L4G1dLGAd-0ze96pOq7Pf9ZXKVvy0MGNn2qZds7-Knzl5mnoTYEn2_bkZTlJKMsqaK9U2DV3rhb1jnnQpsY2t19xx9A9_kYT4LkWwhwLULTfBRp2uqaTLdwC0xMuETYO31VHY" /><input name="RememberMe" type="hidden" value="false" /></form>
    </div>
</div>

        </div>
    </main>

    <div id="toastContainer" class="fixed top-4 right-4 z-[100] flex flex-col gap-3 max-w-sm w-full"></div>

    <script src="/js/dark-mode.js?v=gSGEjKNdCLvpk7Kv6Tk1dgvFgkYbrJg1qFW3mu864XQ"></script>
    <script src="/js/toast.js?v=Kyon9sedNQykwwTUH1OVAUHtXJoRny_A_kDX8TZYCDo"></script>

    

</body>
</html>
